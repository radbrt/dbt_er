name: enhetsregisteret
version: '1.0.0'
config-version: 2

profile: 'default'

analysis-paths: ["analysis"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"

vars:
  dbt_constraints_enabled: true
  dbt_constraints_sources_enabled: false
  dbt_constraints_sources_pk_enabled: true

models:
  enhetsregisteret:
    +schema: develop
    +database: dbthouse
    +materialized: table
    +persist_docs:
      columns: true
      relation: true
    er:
      +schema: dwh
      stg:
        +schema: develop
        +materialized: view
      dwh:
        +schema: dwh
        +materialized: table
    job_ads:
      +database: dbthouse
      +schema: develop
      +materialized: table
    ml:
      +schema: ml
      +materialized: table

snapshots:
  +target_schema: er